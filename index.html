<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniOS Enterprise Workstation v4.8 - OmniCorp Global</title>
    <!-- Modern Enterprise Typography: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
</head>
<body class="enterprise-os">
    <!-- Top Corporate Bar -->
    <header id="top-bar" class="top-bar hidden">
        <div class="top-left">
            <div class="corporate-logo">
                <span class="logo-icon">[+]</span>
                <span class="logo-text">OmniCorp Global</span>
                <span class="badge-env">PROD-US-EAST</span>
            </div>
            <nav id="app-tabs" class="app-tabs">
                <button class="tab-btn active" data-app="synctalk" id="tab-synctalk">
                    <span class="tab-label">SyncTalk</span>
                    <span class="badge-unread" id="synctalk-unread">2</span>
                </button>
                <button class="tab-btn" data-app="meetstream" id="tab-meetstream">
                    <span class="tab-label">MeetStream</span>
                    <span class="badge-status live" id="meetstream-status">LIVE</span>
                </button>
                <button class="tab-btn" data-app="datagrid" id="tab-datagrid">
                    <span class="tab-label">DataGrid</span>
                </button>
                <button class="tab-btn" data-app="omnitask" id="tab-omnitask">
                    <span class="tab-label">OmniTask</span>
                </button>
                <button class="tab-btn" data-app="omnidocs" id="tab-omnidocs">
                    <span class="tab-label">OmniDocs</span>
                </button>
                <button class="tab-btn" data-app="omnivault" id="tab-omnivault">
                    <span class="tab-label">OmniVault</span>
                </button>
                <button class="tab-btn" data-app="omniticket" id="tab-omniticket">
                    <span class="tab-label">OmniTicket</span>
                </button>
            </nav>
        </div>

        <div class="top-right">
            <!-- Patience Bar Container -->
            <div id="patience-bar-container" style="display: none; align-items: center; gap: 8px; margin-right: 15px; font-size: 11px; font-family: var(--font-mono); font-weight: bold; border: 1px solid var(--border-color); padding: 4px 8px; border-radius: 2px;">
                <span>PATIENCE:</span>
                <div style="width: 80px; height: 10px; background: #222; border: 1px solid #444; position: relative; overflow: hidden; border-radius: 1px;">
                    <div id="patience-fill" style="width: 100%; height: 100%; background: var(--accent-green); transition: width 0.3s ease, background-color 0.3s ease;"></div>
                </div>
                <span id="patience-text">100%</span>
            </div>

            <!-- Corporate Clock -->
            <div class="sys-tray-item clock-item">
                <span class="clock-label">TIME:</span>
                <span id="sys-clock" class="clock-time">12:00 PM</span>
            </div>

            <!-- User Profile Badge -->
            <div class="user-badge" title="Logged in as: Junior Data Analyst">
                <div class="avatar-initials">JA</div>
                <span class="user-name">J. Analyst (You)</span>
            </div>
        </div>
    </header>

    <!-- Main Desktop Application Area -->
    <main id="desktop-viewport" class="desktop-viewport hidden">
        <!-- App Window 1: SyncTalk (Chat) -->
        <section id="app-synctalk" class="app-window active"></section>

        <!-- App Window 2: MeetStream (Video Call) -->
        <section id="app-meetstream" class="app-window hidden"></section>

        <!-- App Window 3: DataGrid (Spreadsheet Workbench) -->
        <section id="app-datagrid" class="app-window hidden"></section>

        <!-- App Window 4: OmniTask (Guided Task Dashboard) -->
        <section id="app-omnitask" class="app-window hidden"></section>

        <!-- App Window 5: OmniDocs (Document & Policy Portal) -->
        <section id="app-omnidocs" class="app-window hidden"></section>

        <!-- App Window 6: OmniVault (Corporate File Storage) -->
        <section id="app-omnivault" class="app-window hidden"></section>

        <!-- App Window 7: OmniTicket (Compliance Ticketing Portal) -->
        <section id="app-omniticket" class="app-window hidden"></section>
    </main>

    <!-- Full-Screen Mandatory Blocker Overlays -->
    <div id="overlay-sys-update" class="blocker-overlay hidden"></div>
    <div id="overlay-shutdown" class="blocker-overlay hidden"></div>
    <div id="overlay-virus" class="blocker-overlay hidden"></div>
    <div id="overlay-password" class="blocker-overlay hidden"></div>
    <div id="overlay-meeting" class="blocker-overlay hidden"></div>
    <div id="overlay-cookies" class="blocker-overlay hidden"></div>
    <div id="overlay-calibration" class="blocker-overlay hidden"></div>
    <div id="overlay-survey" class="blocker-overlay hidden"></div>
    <div id="overlay-defrag" class="blocker-overlay hidden"></div>
    <div id="overlay-monologue" class="monologue-overlay hidden"></div>

    <!-- Toast Notification Hub -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Security & Compliance Modal Layer -->
    <div id="modal-layer" class="modal-layer hidden"></div>

    <!-- State Store & Desktop App Bundle -->
    <script src="js/audio.js"></script>
    <script src="js/store.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
